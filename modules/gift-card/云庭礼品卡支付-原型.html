.order-picker-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: #606266;
  font-size: 13px;
  margin-bottom: 12px;
}
.picker-member {
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 16px;
}
.picker-title {
  color: #606266;
  font-size: 13px;
  font-weight: 500;
}
.picker-member-meta {
  color: #909399;
  font-size: 12px;
  white-space: nowrap;
}
.refresh-link {
  flex: none;
  white-space: nowrap;
  padding: 0 7px;
}
.order-picker {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
  margin-bottom: 14px;
  min-height: 120px;
}
.order-option {
  appearance: none;
  display: block;
  width: 100%;
  text-align: left;
  cursor: pointer;
  background: #fff;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  padding: 14px 16px;
  color: #303133;
  font: inherit;
  min-width: 0;
  transition: border-color 0.16s, background 0.16s, box-shadow 0.16s;
}
.order-option:hover:not(:disabled) {
  border-color: #a0cfff;
  background: #fafcff;
}
.order-option.is-selected {
  border-color: #409eff;
  background: #f5faff;
  box-shadow: inset 0 0 0 1px #409eff;
}
.order-option:disabled {
  cursor: not-allowed;
  opacity: 0.72;
}
.order-option-title {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  min-width: 0;
}
.order-radio {
  flex: none;
  width: 16px;
  height: 16px;
  border: 1px solid #c0c4cc;
  border-radius: 50%;
  background: #fff;
  display: grid;
  place-items: center;
}
.order-option.is-selected .order-radio {
  border-color: #409eff;
  background: #409eff;
  box-shadow: inset 0 0 0 4px #fff;
}
.order-number {
  font-size: 14px;
  font-weight: 600;
  overflow-wrap: anywhere;
  min-width: 0;
}
.order-status {
  margin-left: auto;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px 8px;
  line-height: 18px;
  border: 1px solid #f5dab1;
  border-radius: 4px;
  background: #fdf6ec;
  color: #e6a23c;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.order-option-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  color: #909399;
  font-size: 12px;
  margin: 14px 0 0 26px;
}
.order-fact {
  display: flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
}
.order-fact b {
  color: #606266;
  font-size: 13px;
  font-weight: 400;
}
.order-fact.products {
  white-space: normal;
  min-width: 0;
  max-width: 100%;
}
.order-fact.products b {
  line-height: 20px;
  overflow-wrap: anywhere;
}
.order-product-count {
  white-space: nowrap;
}
.order-product-quantity {
  font-weight: 700;
}
.order-fact.amount {
  margin-left: auto;
}
.order-fact.amount b {
  font-weight: 600;
  color: #303133;
  font-variant-numeric: tabular-nums;
}
.order-coupon {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 12px 0 0 26px;
  color: #b88230;
  font-size: 12px;
}
.order-empty {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 270px;
  padding: 32px 20px;
  border: 1px dashed #e4e9f0;
  border-radius: 10px;
  background: linear-gradient(180deg, #fbfcff, #fff);
  text-align: center;
}
.order-empty-art {
  width: 96px;
  height: 96px;
  display: grid;
  place-items: center;
  border-radius: 30px;
  background: linear-gradient(145deg, #eef5ff, #f4f7fc);
  box-shadow: inset 0 0 0 1px #e8eff8, 0 9px 24px rgba(77, 114, 160, 0.05);
  margin-bottom: 22px;
  color: #9fb7d5;
}
.order-empty strong {
  font-size: 16px;
  color: #606266;
  font-weight: 500;
}
.order-empty p {
  margin: 10px 0 0;
  color: #909399;
  font-size: 13px;
  line-height: 22px;
  max-width: 340px;
}
.order-empty-error strong {
  color: #f56c6c;
}
.order-empty-error .order-empty-art {
  color: #f0a8a8;
  background: linear-gradient(145deg, #fff5f5, #fafafa);
  box-shadow: inset 0 0 0 1px #fde2e2, 0 9px 24px rgba(245, 108, 108, 0.06);
}
.pricing-wait {
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  border: 1px solid #edf1f7;
  border-radius: 8px;
  background: #fafcff;
  color: #409eff;
  font-size: 14px;
}
.pricing-spinner {
  animation: merged-pricing-spin 1s linear infinite;
}
.pricing-wait small {
  font-size: 12px;
  color: #909399;
}
@keyframes merged-pricing-spin {
  to {
    transform: rotate(360deg);
  }
}
.private-message {
  color: #e6a23c;
  line-height: 22px;
  margin: 12px 0;
}
.private-message.is-error {
  color: #f56c6c;
  font-weight: 700;
}
.coupon-block {
  padding: 18px;
  background: #fdf6ec;
  border: 1px solid #faecd8;
  border-radius: 6px;
  color: #b88230;
  font-size: 14px;
  line-height: 24px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 8px;
}
.coupon-block p {
  margin: 0;
}
.preview-totals-table {
  width: 100%;
  min-width: 930px;
  table-layout: fixed;
  border-collapse: collapse;
  background: #f5f7fa;
  border-top: 1px solid #ebeef5;
  font-weight: 600;
  color: #303133;
}
.preview-totals-table td {
  padding: 12px 10px;
  vertical-align: middle;
}
.preview-totals-table .num {
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.source-tag {
  display: inline-block;
  padding: 0 8px;
  line-height: 24px;
  border: 1px solid #b3d8ff;
  color: #409eff;
  background: #ecf5ff;
  border-radius: 4px;
  white-space: nowrap;
}
.source-tag.mall {
  border-color: #e9d5ff;
  color: #8b5cf6;
  background: #f5f0ff;
}
.goods-meta {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #909399;
  font-size: 12px;
  line-height: 18px;
}
.goods-name {
  display: block;
  line-height: 20px;
  overflow-wrap: anywhere;
}
.hit-activities {
  margin-top: 18px;
}
.hit-activities h3 {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 10px;
  color: #303133;
}
.hit-activity {
  padding: 12px 14px;
  border: 1px solid #ebeef5;
  border-radius: 4px;
  background: #fafafa;
}
.hit-activity + .hit-activity {
  margin-top: 8px;
}
.hit-activity-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 20px;
}
.hit-activity-head strong {
  min-width: 0;
  flex: 1 1 260px;
  overflow-wrap: anywhere;
  font-weight: 500;
  color: #409eff;
  line-height: 22px;
}
.hit-activity-head > span {
  flex: none;
  white-space: nowrap;
}
.hit-activity-head b {
  color: #f56c6c;
  font-weight: 600;
}
.hit-activity-empty {
  margin: 0;
  padding: 12px 14px;
  background: #fafafa;
  color: #909399;
}
.dialog-footer {
  text-align: center;
}
.detail-table-wrap {
  overflow: auto;
}

function giftMethodHtml(){const g=state.gift;if(!g&&balance()<=0)return '';const success=g?.status==='success',planned=g?.status==='planned',frozen=['freezing','frozen','debiting'].includes(g?.status),error=blocked(),disabled=!g&&(!!error||state.complete);const statusText=planned?'支付':g?.status==='freezing'?'冻结中':g?.status==='frozen'?'已冻结':g?.status==='debiting'?'扣减中':g?.status==='unknown'?'结果待确认':'';return `<div data-section="gift-method" class="paymethod gift gift-tile ${g?'active':''} ${disabled?'is-disabled':''}" tabindex="${disabled?'0':'-1'}" ${disabled?`data-disabled-reason="${esc(error)}" aria-describedby="gift-reason-tooltip"`:''} onmouseenter="showGiftReason(this,'hover')" onmouseleave="hideGiftReason()" onfocusin="showGiftReason(this,'focus')" onfocusout="hideGiftReason()" ${g?`data-state="${success?'gift-applied':planned?'gift-planned':frozen?'gift-frozen':'gift-pending'}"`:''}><button type="button" class="gift-method-main" data-action="pay-gift" onclick="openGift()" ${disabled?'disabled':''} ${disabled?'aria-describedby="gift-reason-tooltip"':`title="${g?(success?'查看本单已使用礼品卡':planned?'已选择，结算时冻结':'礼品卡处理中'):''}"`}><span class="payment-method-main">${icon('creditcard')}<span>礼品卡</span></span>${success?`<small class="gift-tile-amount ${g.p>=10000000?'method-amount-large':''}">支付 <b class="money" data-value="gift-payment">${yuan(g.p)}</b></small>`:g?`<small class="gift-tile-status">${statusText} ${planned||frozen?yuan(g.a):''}</small>`:`<small class="gift-tile-available ${balance()>=10000000?'method-amount-large':''}" data-value="gift-available">可用 ${yuan(balance())}</small>`}</button>${g&&!state.complete&&!['freezing','frozen','debiting'].includes(g.status)?'<button type="button" class="gift-method-remove" aria-label="取消礼品卡支付" data-action="cancel-gift" onclick="cancelGift()">×</button>':''}</div>`}

async function confirmGift(){if(!dialog||dialog.busy||dialog.kind!=='gift')return;const code=document.getElementById('dynamic-code').value.trim();if(!code)return document.getElementById('code-error').textContent='请输入会员动态码';const scene=state.scene;const currentEpoch=requestEpoch;dialog.busy=true;const button=document.querySelector('[data-action="confirm-gift"]');button.disabled=true;button.textContent='验证中…';await new Promise(r=>setTimeout(r,350));if(currentEpoch!==requestEpoch)return;const restriction=paymentRestrictionReason('gift');if(restriction){dialog.busy=false;giftDialog(restriction);return;}if(['code-error','code-expired'].includes(scene)&&!state.faultUsed){state.faultUsed=true;dialog.busy=false;giftDialog(scene==='code-error'?'动态码验证失败，请核对后重新输入':'动态码已过期，请会员重新获取后输入');return;}if(scene==='balance-change'&&!state.faultUsed){state.faultUsed=true;state.cards=[makeCard(6000)];dialog.busy=false;giftDialog('礼品卡余额已变更，可用面值为 ¥60.00，请核对新金额并重新验证');render();return;}const p=plan();if(!p.a){dialog.busy=false;closeDialog();render();toast('无可使用的礼品卡金额','error');return;}state.gift={...p,status:'planned',cardDebits:previewGiftCardDebits(p.a)};dialog.busy=false;closeDialog();render();toast('礼品卡方案已选择，结算时冻结并扣减')}

function allocate(amount,weights){const sum=weights.reduce((a,b)=>a+b,0);if(!sum)return weights.map(()=>0);const v=weights.map(w=>Math.floor(amount*w/sum));let left=amount-v.reduce((a,b)=>a+b,0);const order=weights.map((w,i)=>({i,r:amount*w%sum})).sort((a,b)=>b.r-a.r||a.i-b.i);for(let i=0;i<left;i++)v[order[i%order.length].i]++;return v}
// 礼品卡按商品顺序分摊：前项四舍五入且不超过剩余待摊金额，避免累计取整造成负尾差；最后一个正基数商品取剩余额。
function allocateGiftTail(amount,weights){const sum=weights.reduce((a,b)=>a+Math.max(0,b),0),result=weights.map(()=>0),last=weights.reduce((n,w,i)=>w>0?i:n,-1);if(!sum||last<0)return result;let assigned=0;weights.forEach((w,i)=>{if(w<=0)return;const remaining=Math.max(0,amount-assigned);result[i]=i===last?remaining:Math.min(Math.round(amount*w/sum),remaining);assigned+=result[i];});return result;}
function allocations(){const rawWeights=state.goods.map(g=>g.gift?0:g.price*g.qty),weights=allocate(total(),rawWeights),x=payment();const existing=giftSuccess()?state.gift.existing:x.cashNet+x.mallPay+x.advance+state.scan+state.card;const earlier=allocate(existing,weights);const remain=weights.map((w,i)=>w-earlier[i]);const faces=allocateGiftTail(giftSuccess()?state.gift.a:0,remain);const ps=allocateGiftTail(giftSuccess()?state.gift.p:0,faces);const other=weights.map((w,i)=>w-faces[i]),priorInvoice=allocate(state.advanceInvoiced?x.advance:0,other);return state.goods.map((g,i)=>({name:g.name,gift:g.gift,total:weights[i],face:faces[i],p:ps[i],d:faces[i]-ps[i],other:other[i],invoice:Math.max(0,other[i]-priorInvoice[i])}))}
function allocationTable(){return `<div class="scroll-table"><table data-section="allocation"><thead><tr><th>商品</th><th>${state.mode==='exchange'?'本次补差分摊':'礼品卡优惠前金额'}</th><th>礼品卡使用面值</th><th>礼品卡支付</th><th>礼品卡优惠</th><th>${state.complete?'其他支付 / 可开票上限':'其他方式应付'}</th></tr></thead><tbody>${allocations().map(g=>`<tr><td>${g.name} ${g.gift?'<span class="tag red">赠品</span>':''}</td><td>${money(g.total)}</td><td>${money(g.face)}</td><td>${money(g.p)}</td><td>${money(g.d)}</td><td>${money(state.complete?g.invoice:g.other)}</td></tr>`).join('')}<tr><td><b>合计</b></td><td>${money(total())}</td><td>${money(giftSuccess()?state.gift.a:0)}</td><td>${money(payment().p)}</td><td>${money(payment().d)}</td><td>${money(state.complete?invoiceMaximum():total()-(giftSuccess()?state.gift.a:0))}</td></tr></tbody></table></div>`}

function allocationTrace(amount,weights){const sum=weights.reduce((a,b)=>a+Math.max(0,b),0),base=weights.map(w=>sum&&w>0?Math.round(amount*w/sum):0),result=allocateGiftTail(amount,weights),last=weights.reduce((n,w,i)=>w>0?i:n,-1);let assigned=0;const before=result.map(v=>{const remaining=Math.max(0,amount-assigned);assigned+=v;return remaining;});return {amount,weights,sum,base,result,last,before,capped:base.map((v,i)=>i!==last&&weights[i]>0&&v>before[i]),bonus:result.map((v,i)=>v-base[i]),tail:amount-base.reduce((a,b)=>a+b,0)};}
function allocationTraceTable(trace,kind){return `<div class="scroll-table"><table data-section="allocation-trace-${kind}"><thead><tr><th>商品</th><th>参与基数（元）</th><th>理论分摊（分）</th><th>四舍五入（分）</th><th>分摊前剩余（分）</th><th>上限 / 尾差调整（分）</th><th>最终分摊（元）</th></tr></thead><tbody>${state.goods.map((g,i)=>`<tr><td>${esc(g.name)}${g.gift?' <span class="tag red">赠品·不参与</span>':''}</td><td>${money(trace.weights[i])}</td><td>${trace.weights[i]<=0?'不参与':trace.sum?(trace.amount*trace.weights[i]/trace.sum).toFixed(4):'0.0000'}</td><td>${trace.base[i]}</td><td>${trace.weights[i]>0?trace.before[i]:'—'}</td><td>${trace.bonus[i]>0?'+':''}${trace.bonus[i]}</td><td>${money(trace.result[i])}${trace.capped[i]?'<br><small class="blue">剩余上限 · min('+trace.base[i]+', '+trace.before[i]+') ＝ '+trace.result[i]+' 分</small>':i===trace.last?'<br><small class="blue">最后一件 · '+trace.amount+' − '+trace.result.slice(0,i).reduce((a,b)=>a+b,0)+' ＝ '+trace.result[i]+' 分</small>':''}</td></tr>`).join('')}<tr><td><b>合计</b></td><td>${money(trace.sum)}</td><td>${trace.amount} 分</td><td>${trace.base.reduce((a,b)=>a+b,0)}</td><td>—</td><td>${trace.tail>0?'+':''}${trace.tail}</td><td><b>${money(trace.amount)}</b></td></tr></tbody></table></div>`;}

function mallCandidate(f){const count=mallCount(f.type),disabled=state.mallIneligible||(f.type==='deductions'&&rawTotal()<30000);let body='';if(f.type==='stored_value')body=`<div class="mall-face"><small>卡面金额</small>${yuan(f.face)}</div><div class="note">顾客购卡 ${yuan(f.purchase)} · 优惠金额 ${yuan(f.face-f.purchase)}<br>${count?'本单已添加 '+count+' 张':'添加后可在下方调整本单使用金额'}</div>`;if(f.type==='discount')body='<div class="mall-face" style="color:#b88230">9 <small>折</small></div><div class="note">不限优惠金额</div>';if(f.type==='deductions')body='<div class="coupon-hero"><div class="coupon-stub">满300<br>减20</div><div class="coupon-body">可叠加门店营销活动<br>每单限用 4 张<br>已选 '+count+' 张</div></div>';if(f.type==='voucher')body='<div class="coupon-hero"><div class="coupon-stub">¥50</div><div class="coupon-body">顾客支付 ¥40.00<br>可叠加门店营销活动<br>每单限用 4 张 · 已选 '+count+' 张</div></div>';if(f.type==='points')body=`<div class="mall-face"><small>本单最多可抵</small>¥${money(Math.min(2000,payment().pending+(state.mallInstances.find(r=>r.type==='points')?.amount||0)))}</div><div class="points-edit"><span>¥</span><input id="points-amount" ${!payment().pending&&!count?'disabled':''} inputmode="decimal" aria-label="商场积分抵扣金额" placeholder="0.00" value="${money(state.mallInstances.find(r=>r.type==='points')?.amount||0)}" onchange="applyPoints(this.value)"><span>元</span></div><div class="points-quicks">${[100,300,500,800].map(v=>btn('¥'+v,`applyPoints('${v}')`,'small',v*100>Math.min(2000,payment().pending+(state.mallInstances.find(r=>r.type==='points')?.amount||0)))).join('')}</div><div class="note">商场承担 ${yuan(Math.round((state.mallInstances.find(r=>r.type==='points')?.amount||0)*.5))}　门店承担 ${yuan(Math.round((state.mallInstances.find(r=>r.type==='points')?.amount||0)*.5))}</div>`;return `<article class="mall-card ${count?'selected':''} ${disabled?'disabled':''} ${f.type==='points'?'mall-point-card':''}" data-mall-type="${f.type}"><div class="heading"><b>${f.name}</b>${f.type==='points'?'':`<span class="tag ${f.type==='discount'?'orange':''}">商场${f.label}</span>`}</div>${body}${f.type==='points'?'':btn(f.type==='discount'&&count?'取消使用':'使用'+f.label,`addMall('${f.type}')`,'primary small',disabled||(!payment().pending&&!(f.type==='discount'&&count))||(['voucher','deductions'].includes(f.type)&&count>=4),`data-action="add-mall-${f.type}"`)}${disabled?'<div class="note red">'+(state.mallIneligible?'当前订单不满足本活动门店或商品范围':'未达到活动金额门槛')+'</div>':''}</article>`}
function mallUsedRow(r,i,ro){const stored=r.type==='stored_value',coupon=['deductions','voucher'].includes(r.type),count=mallCount(r.type),coded=state.mallInstances.filter(x=>x.type===r.type&&x.code).length;return `<div class="mall-used-row"><div><b>${r.name}</b><div class="sub">${stored?'卡面 ¥100.00 · 顾客购卡 ¥80.00 · 本单使用 '+yuan(r.amount):r.type==='points'?'积分抵扣金额 −'+yuan(r.amount):coupon?count+' 张 · 已录券码 '+coded+' 个':'9 折'}</div></div><div class="mall-used-controls">${stored&&!ro?`<span class="muted">最多 ${yuan(mallStoredMaximum(i))}</span><input inputmode="decimal" aria-label="第${i+1}张商场储值卡使用金额" value="${money(r.amount)}" oninput="clampMallStoredInput(${i},this)" onchange="updateMallAmount(${i},this.value)">元`:''}${coupon&&!ro?`<div class="qty-control"><button aria-label="减少${r.name}张数" data-mall-minus="${r.type}" onclick="decreaseMallCoupon('${r.type}')">−</button><span>${count}</span><button aria-label="增加${r.name}张数" data-mall-plus="${r.type}" onclick="addMall('${r.type}')" ${count>=4||!payment().pending?'disabled':''}>+</button></div>`+btn('券码（选填）',`openMallCode(${i})`,'link small'):''}${!ro?btn('移除',coupon?`removeMallType('${r.type}')`:`removeMall(${i})`,'link small',false,`data-remove-mall="${i}"`):''}</div></div>`}
function removeMallType(type){if(mallReadonly())return;state.mallInstances=state.mallInstances.filter(r=>r.type!==type);activities.mall.active=!!state.mallInstances.length;mallDialog();render()}
function decreaseMallCoupon(type){if(mallReadonly())return;const indices=state.mallInstances.map((r,i)=>r.type===type?i:-1).filter(i=>i>=0),last=indices.at(-1);if(last===undefined)return;if(state.mallInstances[last].code)return toast('该活动最后一张券已录入券码，请先清除券码再减券','error');removeMall(last)}
function validateMallChange(previous){const x=payment(),fixed=x.p+x.mallPay+x.advance+state.scan+state.card,conflict=giftSuccess()&&state.mallInstances.some(r=>!activityAllowsPayment(r,'gift'));if(fixed>x.due||conflict){state.mallInstances=previous;toast(conflict?'该活动不支持本单已使用的礼品卡':'调整后可支付金额不足，请先调整其他渠道收款','error');return false}activities.mall.active=state.mallInstances.length>0;return true}
function addMall(type){if(mallReadonly())return;if(!payment().pending&&!(type==='discount'&&mallCount(type)))return;const old=JSON.parse(JSON.stringify(state.mallInstances));if(type==='discount'&&mallCount(type)){state.mallInstances=state.mallInstances.filter(r=>r.type!==type)}else{const f=MALL_FIXTURES.find(f=>f.type===type);if(['voucher','deductions'].includes(type)&&mallCount(type)>=4)return toast('已达本单限用张数','error');state.mallInstances.push({type,name:f.name,amount:type==='stored_value'?Math.min(10000,payment().pending):0,code:'',blockedPaymentMethods:activityRestrictedMethods(activities.mall)});}validateMallChange(old);mallDialog();render()}
function removeMall(i){if(mallReadonly())return;state.mallInstances.splice(i,1);activities.mall.active=!!state.mallInstances.length;mallDialog();render()}
function clearMall(){if(mallReadonly())return;modal('清空活动','<p>清空本单全部商场活动及已录券码？</p>',btn('取消','mallDialog()')+btn('确定清空',"state.mallInstances=[];activities.mall.active=false;mallDialog();render()",'primary'))}
function mallStoredMaximum(i){return Math.min(10000,Math.max(0,payment().pending+(state.mallInstances[i]?.amount||0)));}
function clampMallStoredInput(i,el){const n=inputMoney(el.value);if(n!==null&&n>mallStoredMaximum(i))el.value=money(mallStoredMaximum(i));}
function updateMallAmount(i,value){if(mallReadonly())return;const n=inputMoney(value);if(n===null){toast('请输入合法金额，最多两位小数','error');return mallDialog()}const amount=Math.min(n,mallStoredMaximum(i)),old=copy(state.mallInstances);if(!amount)state.mallInstances.splice(i,1);else state.mallInstances[i].amount=amount;validateMallChange(old);mallDialog();render()}
function applyPoints(value){if(mallReadonly())return;const n=inputMoney(value),existing=state.mallInstances.find(r=>r.type==='points')?.amount||0,max=Math.min(2000,payment().pending+existing);if(n===null){toast('请输入合法积分抵扣金额','error');return mallDialog()}if(!existing&&!payment().pending)return;const old=copy(state.mallInstances);state.mallInstances=state.mallInstances.filter(r=>r.type!=='points');const amount=Math.min(n,max);if(amount)state.mallInstances.push({type:'points',name:'商场积分抵扣（演示）',amount,code:'',blockedPaymentMethods:activityRestrictedMethods(activities.mall)});validateMallChange(old);mallDialog();render()}
function openMallCode(i){const r=state.mallInstances[i];if(!r)return mallDialog();const entries=state.mallInstances.map((x,n)=>({...x,index:n})).filter(x=>x.type===r.type&&x.code);dialog={kind:'mallCode',index:i};modal('券码（选填）',`<p>${r.name}</p><div class="toolbar"><input id="mall-code-input" placeholder="请输入/扫描券码" maxlength="100">${btn('添加',`saveMallCode(${i})`,'primary')}</div><div class="note">已使用 ${mallCount(r.type)} 张，已录入 ${entries.length} 个券码。</div>${entries.length?entries.map(x=>`<div class="mall-code-row"><span>${esc(x.code)}</span>${btn('删除',`state.mallInstances[${x.index}].code='';openMallCode(${i})`,'link small')}</div>`).join(''):'<div class="empty" style="padding:30px">尚未录入券码</div>'}<div id="mall-code-error" class="field-error"></div>`,btn('完成','mallDialog()','primary'))}
function saveMallCode(i){const code=document.getElementById('mall-code-input').value.trim(),r=state.mallInstances[i],error=document.getElementById('mall-code-error');if(!code)return error.textContent='请输入或扫描券码';if(state.mallInstances.some(x=>x.code===code))return error.textContent='同一订单券码不可重复';const target=state.mallInstances.find(x=>x.type===r.type&&!x.code);if(!target)return error.textContent='已录入券码数量达到使用张数';target.code=code;openMallCode(i);toast('券码已保存')}


function initializeMode(id){
state.mode='normal';state.advanceAmount=0;state.advanceFrozen=false;state.advanceInvoiced=false;state.mergedConfirmed=false;state.mergedPending=false;state.exchangeCredit=0;
if(id.startsWith('ecommerce-')){state.mode='ecommerce';state.deliveryType=id==='ecommerce-cloud'?'cloud':id==='ecommerce-store'?'store':'store_cloud';state.deliveryReady=id!=='ecommerce-address';state.deliveryStockOk=id!=='ecommerce-stock';if(id==='ecommerce-cloud')state.cards=[makeCard(50000)];if(id==='ecommerce-store')state.cashGross=5000;}
if(id.startsWith('merged-')){state.mode='merged';state.mergedConfirmed=['merged-linked','merged-denied'].includes(id);state.mergedPending=id==='merged-pending';state.mergedCoupon=id==='merged-coupon';if(state.mergedConfirmed)applyMergedSnapshot();if(id==='merged-denied')activities.store.blockedPaymentMethods=['gift'];}
if(id.startsWith('advance-')){state.mode='advance';state.advanceAmount=id==='advance-select'?0:id==='advance-covered'?30000:10000;state.advanceFrozen=id==='advance-freeze';if(id==='advance-mixed')state.cashGross=5000;if(id==='advance-enough')state.cards=[makeCard(50000)];}
if(id.startsWith('exchange-')){state.mode='exchange';state.exchangeCredit=id==='exchange-equal'?30000:id==='exchange-insufficient'?35000:id==='exchange-original-gift'?18800:20000;state.originalGift=id==='exchange-original-gift'?{face:10000,p:8800,d:1200,k:8800,other:10000}:null;state.cards=[makeCard(id==='exchange-enough'?50000:6000)];if(id==='exchange-cash')state.cashGross=3000;}
}
function modeLabel(){if(state.specialCheckout)return state.specialCheckout.name;return {normal:'普通收银',ecommerce:'POS电商',merged:'私域联合改价',advance:'消费核销预收款',exchange:'换货补差'}[state.mode]}
function applyMergedSnapshot(){state.goods=state.goods.filter(g=>!g.gift);activities.store.name='联合改价活动（演示）';}
function addExchangeGoods(){if(lockedOperation())return;state.goods.push({...baseGoods()[1],name:'补充换入商品（演示）'});closeDialog();render();toast('已增加换入商品，可继续补差收银')}
function invoiceMaximum(){const x=payment();return Math.max(0,x.received-x.p-(state.advanceInvoiced?x.advance:0))}
function modeOrderFacts(){let facts=[];if(state.mode==='ecommerce')facts=[['发货模式/数量',deliveryLabel()],['收货信息','演示收件人 / 演示收货地址']];if(state.mode==='merged')facts=[['关联商城订单','商城订单（演示）'],['商城待付款（另收）','¥180.00'],['本POS改价后金额','¥270.00']];if(state.mode==='advance')facts=[['本次预收款核销',yuan(state.advanceAmount)],['核销组合',state.advanceFrozen?'原组合已冻结':'已确认消费核销']];if(state.mode==='exchange')facts=[['原单可抵换金额',yuan(state.exchangeCredit)],['换入商品金额',yuan(rawTotal())],['本次补差优惠前',yuan(total())]];if(state.specialCheckout)facts=[...facts,['收银场景',state.specialCheckout.name],['来源售后单',state.specialCheckout.sourceOrder],['换新规则',state.specialCheckout.ruleName]];return facts.map(([k,v])=>`<div class="kv"><span>${k}：</span><b>${v}</b></div>`).join('')}

const orderTagFixtures=()=>[
 {id:'foreign',code:'FOREIGN_TOURIST',tagName:'外国游客',tagType:'1',remark:'外国游客订单不参与会员积分。'},
 {id:'manual-a',code:'DEMO_A',tagName:'演示标签 A',tagType:'1',remark:'总部配置的手工订单标签，普通标签不改变订单计价。'},
 {id:'manual-b',code:'DEMO_B',tagName:'演示标签 B',tagType:'1',remark:''}
];
function allOrderTags(){return [...state.tagOptions,...state.tagInherited.filter(t=>!state.tagOptions.some(o=>o.id===t.id)).map(t=>({...t,unavailable:true}))]}
function selectedTags(){return allOrderTags().filter(t=>state.tagIds.includes(t.id))}
function foreignTag(){return selectedTags().some(t=>t.code==='FOREIGN_TOURIST')}
function tagReadError(){return state.tagLoading?'请等待订单标签加载完成':state.tagError||''}
function tagDisabled(){return !state.goods.length||!!tagReadError()||state.complete||!!state.gift||!!state.advanceFrozen||!!state.defectiveFlowLocked}
function tagItemDisabled(t){return tagDisabled()||(t.code==='FOREIGN_TOURIST'&&(state.mergedConfirmed||state.tagForeignLocked))||(!state.tagIds.includes(t.id)&&(t.unavailable||state.tagIds.length>=20))}
function memberDisabled(){return locked()||state.mergedConfirmed||foreignTag()||state.tagLoading}
function clearForeignContext(){state.tagPointsBefore=state.issuePoints;state.tagAdvanceBefore=state.useAdvance;state.issuePoints='0';state.member=false;state.memberCoupon=null;state.advanceAmount=0;state.advanceItems=[];state.advanceInvoiced=false;state.useAdvance='0';state.tagAdvanceRestored=false;}
function toggleOrderTag(id){if(blockGiftOperation())return;const t=allOrderTags().find(t=>t.id===id);if(!t||tagItemDisabled(t))return;const selected=state.tagIds.includes(id);state.tagIds=selected?state.tagIds.filter(x=>x!==id):[...state.tagIds,id];if(t.code==='FOREIGN_TOURIST'){if(selected){state.issuePoints=state.tagPointsBefore??state.issuePoints;state.useAdvance=state.tagAdvanceBefore??state.useAdvance;state.tagAdvanceRestored=true;delete state.tagPointsBefore;delete state.tagAdvanceBefore;}else clearForeignContext();}render();}
function resetOrderTags(){if(foreignTag()&&state.tagPointsBefore!==undefined)state.issuePoints=state.tagPointsBefore;state.tagIds=[];state.tagInherited=[];state.tagForeignLocked=false;state.tagRelationFailure=false;if(state.tagError==='订单标签恢复失败')state.tagError='';delete state.tagPointsBefore;delete state.tagAdvanceBefore;state.tagAdvanceRestored=false;}
function pointsHtml(){const dis=foreignTag()||state.tagLoading;return `<div class="radios points-group" role="radiogroup" aria-label="是否发放积分" aria-disabled="${dis}" tabindex="${foreignTag()?'0':'-1'}" onclick="notifyForeignPoints(event)" onkeydown="notifyForeignPoints(event)">${[['1','是'],['0','否']].map(([v,n])=>`<label><input type="radio" name="points" value="${v}" ${state.issuePoints===v?'checked':''} ${dis||state.complete?'disabled':''} onchange="changeIssuePoints('${v}')">${n}</label>`).join('')}</div>`}
function notifyForeignPoints(e){if(!foreignTag()||e.type==='keydown'&&!['Enter',' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();e.stopPropagation();toast('外国游客订单不参与会员积分','error')}
function changeIssuePoints(v){if(foreignTag()||state.tagLoading||state.complete)return;state.issuePoints=v;render()}
function orderTagsHtml(){return `<div class="form-row order-tags-row" data-section="order-tags"><label>订单标签</label><div class="cashier-tags">${allOrderTags().map(t=>`<div class="cashier-tags__item ${state.tagIds.includes(t.id)?'selected':''}" data-order-tag="${t.id}"><label><input type="checkbox" data-tag-id="${t.id}" ${state.tagIds.includes(t.id)?'checked':''} ${giftDisabledAttrs(tagItemDisabled(t),true)} onchange="toggleOrderTag('${t.id}')"><span>${esc(t.tagName)}</span></label>${t.remark?`<button type="button" class="cashier-tags__help" aria-label="${esc(t.tagName)}标签说明" onclick="showTagRemark('${t.id}',this)">?</button>`:''}</div>`).join('')}${state.tagIds.length>=20?'<small>单笔订单最多选择20个标签</small>':''}</div></div>`}
function showTagRemark(id,el){let pop=document.getElementById('tag-popover');if(pop?.dataset.tag===id&&!pop.hidden){pop.hidden=true;return}if(!pop){pop=document.createElement('div');pop.id='tag-popover';pop.className='tag-popover';pop.role='tooltip';document.body.appendChild(pop)}pop.textContent=allOrderTags().find(t=>t.id===id)?.remark||'';pop.dataset.tag=id;pop.hidden=false;const r=el.getBoundingClientRect();pop.style.left=Math.max(12,Math.min(r.right-260,innerWidth-272))+'px';pop.style.top=Math.min(r.bottom+8,innerHeight-pop.offsetHeight-12)+'px';}
document.addEventListener('click',e=>{if(!e.target.closest('.cashier-tags__help'))document.getElementById('tag-popover')?.setAttribute('hidden','')});
function detailTagsHtml(){return (state.settlementTags||selectedTags()).map(t=>`<span class="tag ${t.tagType==='2'?'red':''}" data-detail-tag="${t.id}">${esc(t.tagName)}</span>`).join('')||'-'}
function restoreOrderTagRelations(relations,exchange=false){const manual=relations.filter(t=>String(t.tagType)!=='2');state.tagInherited=manual.map(t=>({...t}));state.tagIds=manual.map(t=>t.id);state.tagForeignLocked=exchange&&foreignTag();if(foreignTag())clearForeignContext();}
function initializeOrderTags(id=''){
state.issuePoints='1';state.useAdvance=state.advanceAmount?'1':'0';state.tagOptions=orderTagFixtures();state.tagIds=[];state.tagInherited=[];state.tagForeignLocked=false;state.tagLoading=false;state.tagError='';state.tagRelationFailure=false;state.tagAdvanceRestored=false;delete state.tagPointsBefore;delete state.tagAdvanceBefore;delete state.settlementTags;delete state.settlementTagIds;
if(['tags-manual','tags-load-error','tags-hold'].includes(id))state.tagIds=['manual-a'];

if(id==='tags-limit'){state.tagOptions.push(...Array.from({length:20},(_,i)=>({id:'extra-'+i,code:'DEMO_'+i,tagName:'演示标签 '+String(i+1).padStart(2,'0'),tagType:'1'})));state.tagIds=state.tagOptions.filter(t=>t.id!=='foreign').slice(0,20).map(t=>t.id);}
if(id==='tags-long')state.tagOptions.push({id:'long',code:'DEMO_LONG',tagType:'1',tagName:'演示超长标签名称用于校验收银信息区域自动换行和边界显示',remark:'这是演示用的长说明。标签名称与说明来自总部配置，长内容应完整换行，点击其他区域后关闭。'});
if(id==='tags-empty')state.tagOptions=[];

function saleFilterHtml(n,i){const value=saleQuery[n]||'';if(i<2)return `<label>${n}<div class="range-input"><input data-sale-filter="${n}开始日期" aria-label="${n}开始日期" placeholder="开始日期" value="${esc(saleQuery[n+'开始日期']??(i===1?'2026-10-04':''))}"><span>至</span><input data-sale-filter="${n}结束日期" aria-label="${n}结束日期" placeholder="结束日期" value="${esc(saleQuery[n+'结束日期']??(i===1?'2026-11-04':''))}"></div></label>`;if(['订单编号','第三方订单号','会员手机号','商品名称/条码','订单归属店员'].includes(n))return `<label>${n}<input data-sale-filter="${n}" aria-label="${n}" placeholder="${n==='订单归属店员'?'请输入店员姓名':'请输入'+n}" value="${esc(value)}" onkeydown="if(event.key==='Enter')searchSaleOrders()"></label>`;const multi=['开票状态','改价原因','平台','异常收银报备','订单发货类型','云仓发货状态','标签','门店类型','业务类型','云仓发货类型'].includes(n);return `<label>${n}${multi?multiSelectHtml('sale-'+i,n,saleFilterOptions(n),saleQuery[n+'多选']||[],'setSaleMulti','请选择',n):`<select data-sale-filter="${n}" aria-label="${n}" onchange="searchSaleOrders()"><option value="">${i===2?'请选择支付方式':i===3?'请选择订单类型':i===4?'请选择订单状态':'请选择'}</option>${saleFilterOptions(n).map(v=>`<option ${value===v?'selected':''}>${v}</option>`).join('')}</select>`}</label>`;}
function multiSelectHtml(id,label,options,selected,callback,placeholder='请选择',key=''){return `<details class="native-multiselect" id="${id}"><summary role="combobox" aria-label="${label}" aria-expanded="false"><span>${selected.length?`<span class="multi-tag">${esc(selected[0])}</span>${selected.length>1?`<span class="multi-tag">+ ${selected.length-1}</span>`:''}`:`<span class="muted">${placeholder}</span>`}</span>${icon('arrow-down')}</summary><div class="multi-options">${options.map((v,i)=>`<label><input type="checkbox" data-multi="${id}" value="${esc(v)}" ${selected.includes(v)?'checked':''} onchange="${callback}('${esc(key)}','${esc(v)}',this.checked)">${esc(v)}</label>`).join('')}${selected.length?btn('清空',`${callback}('${esc(key)}','',false)`,'link small'):''}</div></details>`;}
function setAdvanceTypes(key,v,checked){readAdvanceSearch();syncAdvanceInputs();const a=advanceDraft.types||[];advanceDraft.types=!v?[]:checked?[...a,v]:a.filter(n=>n!==v);advanceDraft.query={phone:advanceDraft.phone,remark:advanceDraft.remark,name:advanceDraft.name};advanceDraft.page=1;drawAdvance();}
function setSaleMulti(key,v,checked){const a=saleQuery[key+'多选']||[];saleQuery[key+'多选']=!v?[]:checked?[...a,v]:a.filter(n=>n!==v);searchSaleOrders();}
function filteredSaleOrders(){return saleOrderFixtures().filter(r=>{if(saleQuery.order&&!r.no.includes(saleQuery.order))return false;if(saleQuery['包含支付方式']&&!(r.contains||[r.pay]).includes(saleQuery['包含支付方式']))return false;if(saleQuery['第三方订单号'])return false;if(saleQuery['会员手机号']&&!'13800000000'.includes(saleQuery['会员手机号']))return false;if(saleQuery['商品名称/条码']&&!['演示商品 A','演示商品 B','演示条码 A','演示条码 B'].some(n=>n.includes(saleQuery['商品名称/条码'])))return false;if(saleQuery['订单归属店员']&&!'店员 A'.includes(saleQuery['订单归属店员']))return false;const facts={'支付方式':r.pay,'订单类型':r.orderType||'正常单','订单状态':'已完成','是否退单':r.refunded?'是':'否','是否换货':r.orderType==='换货单'?'是':'否','是否团购':'否','是否积分':'是','订单商品类型':r.defective?'特惠品':'普通商品','是否完善收货地址':r.cloud?'是':'否','有无标签':'有','有无改价凭证':'无','开票状态':state.scene==='exchange-invoice'?'开票中':'未开票','门店类型':'直营','业务类型':'线下门店','云仓发货类型':r.cloud?'大仓发货':'-','订单发货类型':r.cloud?'云仓发货':'门店发货','云仓发货状态':r.cloud==='DELIVERED'?'已发货':r.cloud?'拦截发货中':'-','标签':'演示标签 A','改价原因':'-','平台':'-','异常收银报备':'-'};for(const [k,v]of Object.entries(facts)){if(saleQuery[k]&&saleQuery[k]!==v)return false;const a=saleQuery[k+'多选'];if(a?.length&&!a.includes(v))return false;}return true;});}
function exchangeReasonHtml(i,r,ro){const labels={normal:'普通原因',remark:'需备注',evidence:'需凭证'};return `<details class="native-cascader" data-exchange-reason="${i}"><summary ${ro?'style="pointer-events:none;opacity:.6" tabindex="-1" aria-disabled="true"':''} role="combobox" aria-expanded="false" aria-controls="exchange-reason-options-${i}" aria-label="${esc(sourceOrder.goods[i].name)}换货原因" onclick="toggleExchangeReasonPopup(event,this)">${r.reason?'演示原因 / '+labels[r.reason]:'<span class="muted">请选择换货原因</span>'}${icon('arrow-down')}</summary>${!ro?`<div class="cascader-panel" id="exchange-reason-options-${i}"><span class="cascader-parent">演示原因　›</span><div>${Object.entries(labels).map(([v,n])=>`<button data-reason-option="${i}-${v}" onclick="changeExchangeReason(${i},'${v}')">${n}</button>`).join('')}${r.reason?`<button onclick="changeExchangeReason(${i},'')">清空</button>`:''}</div></div>`:''}</details>`;}

let exchangeReasonPopup=null;
function closeExchangeReasonPopup(restoreFocus=false){const popup=exchangeReasonPopup;if(!popup)return;exchangeReasonPopup=null;popup.panel.remove();popup.panel.classList.remove('exchange-reason-popup');popup.panel.removeAttribute('style');popup.panel.removeAttribute('data-section');popup.owner.appendChild(popup.panel);popup.owner.open=false;popup.trigger.setAttribute('aria-expanded','false');if(restoreFocus&&popup.trigger.isConnected)popup.trigger.focus({preventScroll:true});}
function toggleExchangeReasonPopup(event,trigger){event.preventDefault();if(trigger.getAttribute('aria-disabled')==='true')return;const owner=trigger.closest('[data-exchange-reason]');if(exchangeReasonPopup?.owner===owner){closeExchangeReasonPopup(true);return;}closeExchangeReasonPopup();const panel=owner.querySelector('.cascader-panel');if(!panel)return;owner.open=true;trigger.setAttribute('aria-expanded','true');panel.classList.add('exchange-reason-popup');panel.setAttribute('data-section','exchange-reason-popup');document.body.appendChild(panel);exchangeReasonPopup={owner,trigger,panel};const rect=trigger.getBoundingClientRect(),margin=8,gap=4,width=Math.min(300,window.innerWidth-margin*2),below=Math.max(0,window.innerHeight-rect.bottom-gap-margin),above=Math.max(0,rect.top-gap-margin);panel.style.width=width+'px';panel.style.left=Math.max(margin,Math.min(rect.right-width,window.innerWidth-width-margin))+'px';const useBelow=panel.offsetHeight<=below||below>=above,available=useBelow?below:above;panel.style.maxHeight=available+'px';panel.style.minHeight=Math.min(160,available)+'px';panel.style.top=(useBelow?rect.bottom+gap:Math.max(margin,rect.top-gap-panel.offsetHeight))+'px';panel.querySelector('button')?.focus({preventScroll:true});}
document.addEventListener('click',e=>{const popup=exchangeReasonPopup;if(popup&&!popup.owner.contains(e.target)&&!popup.panel.contains(e.target))closeExchangeReasonPopup();});
document.addEventListener('focusin',e=>{const popup=exchangeReasonPopup;if(popup&&!popup.owner.contains(e.target)&&!popup.panel.contains(e.target))closeExchangeReasonPopup();});
document.addEventListener('scroll',e=>{if(exchangeReasonPopup&&!exchangeReasonPopup.panel.contains(e.target))closeExchangeReasonPopup();},true);
window.addEventListener('resize',()=>closeExchangeReasonPopup());

 const lineLabels=lineColumns.map(c=>c.label),giftLabels=lineColumns.filter(c=>giftLineProps.has(c.prop)).map(c=>c.label);
 return `<div class="order-detail after-order-detail" data-page="after-order" data-after-status="${status.code}">${detailCard('基本信息',basic)}${detailCard('支付信息',pay,'data-section="after-payment-card"')}${detailCard(isExchangeService?'换货信息':'退货信息',detailTable(lineLabels,rows,'data-section="after-return-lines"',giftLabels),'data-section="after-return-card"')}${detailCard('退款记录',records,'data-section="after-refund-card"')}${detailCard('关联信息',relationTable)}<div class="detail-bottom after-bottom"><div>${btn('返 回','openAfterOrders()')}${s.channels.some(c=>c.status==='W')?btn('查询退款结果','queryReturnResult()','primary',false,'data-action="query-return-result"'):''}${s.channels.some(c=>c.status==='F')?btn('重试失败退款','retryReturnGift()','primary',false,'data-action="retry-return-gift"'):''}${status.code==='success'?btn('补打退货小票',`openReturnReceipt('${s.id}')`,'primary',false,'data-action="after-return-receipt"'):''}</div></div></div>`;
}
function viewReturnOriginal(key){const o=returnOrders[key];if(!o)return;if(!state.complete)cashierDraft=captureOrderContext();restoreOrderContext(copy(o.context));page='order';render();}
function applyReturnHistoryToState(id){const o=returnOrders['fixture:'+id];if(!o)return;state.returnSourceKey=o.key;state.goods=copy(o.context.state.goods);state.paymentAudit=copy(returnAuditModel(o).rows);}
let returnRecordKey=null;
function openReturnRecords(key){returnRecordKey=key;paymentRecordCase='after-return';paymentRecordQuery={};paymentRecordPage=1;nav('paymentRecords');}
function openReturnReceipt(id){const s=returnServices.find(s=>s.id===id);if(!s||serviceState(s).code!=='success')return toast('退款尚未全部成功，暂不可补打退货小票','error');const o=returnOrders[s.orderKey],model={goods:s.lines.map(l=>({name:l.name,barcode:l.barcode,price:l.qty?Math.round((l.grossTotal??(l.total+l.discount))/l.qty):0,qty:l.qty,gift:l.gift,settlement:l.grossTotal??(l.total+l.discount)})),returnGiftFace:s.face,returnOtherAmount:s.channels.filter(c=>c.method!=='gift_card').reduce((n,c)=>n+c.amount,0),returnAmount:s.total,returnQty:s.qty,afterOrder:s.no,order:o.no,member:true,assistant:'店员 A'};modal('退货单小票',receiptHtml('return',model),btn('关闭','closeDialog()'),'receipt-dialog');}
function openReturnEntry(){if(state.complete)return beginReturn();if(lastCompletedOrder){enterOrderContext();return beginReturn();}nav('saleOrders');toast('请选择已完成销售单的退单入口');}

function returnHistoryCardHtml(){const o=returnOrders[state.returnSourceKey],rows=returnServices.filter(s=>s.orderKey===o?.key);if(!o||!rows.length)return '';return detailCard('售后退货单',detailTable(['售后单号','售后金额','退款时间','售后状态'],rows.map(s=>[btn(s.no,`viewAfterOrder('${s.id}')`,'link small'),money(s.total),s.createTime,serviceState(s).label]),'data-section="order-after-history"'));}


let prototypeToolsOpen=false,prototypeInvoiceTools='',returnSimulationOutcome='success';
function prototypeToolsSection(title,body){return `<section class="prototype-tools-section"><h3 class="prototype-tools-title">${title}</h3>${body}</section>`;}
function prototypeToolsHtml(){
 let context='';
 if(dialog?.kind==='invoice')context=prototypeToolsSection('发票演示示例与说明',prototypeInvoiceTools);
 else if(dialog?.kind==='returnConfirmation')context=prototypeToolsSection('退款演示设置',`<label class="return-outcome">模拟返回结果 <select id="return-outcome" aria-label="模拟退款结果" onchange="returnSimulationOutcome=this.value">${[['success','全部成功'],['pending','结果待确认'],['gift-fail','礼品卡退款失败']].map(([v,t])=>`<option value="${v}" ${returnSimulationOutcome===v?'selected':''}>${t}</option>`).join('')}</select></label><div class="note">仅本地模拟，不发起真实退款。</div>`);
 else if(page==='paymentRecords')context=prototypeToolsSection('订单流水演示示例',paymentRecordDemoToolsHtml());
 else if(page==='order'||page==='afterOrder'){
  const service=returnServices.find(s=>s.id===afterSelectedId),scenario=state?.exchangeScenario||service?.exchangeScenario||returnOrders[service?.orderKey]?.context?.state?.exchangeScenario;
  if(scenario)context=prototypeToolsSection('换货分摊与多次售后',exchangeScenarioCardHtml(scenario));
 }
 const links=[];
 if(page==='order')links.push(btn('订单流水',"openPaymentRecords('current')",'small',false,'data-action="order-payment-records"'));
 if(page==='afterOrder'){const service=returnServices.find(s=>s.id===afterSelectedId);if(service)links.push(btn('订单流水',`openReturnRecords('${service.orderKey}')`,'small',false,'data-action="after-payment-records"'));}
 if(page==='order'&&state.complete)links.push(btn('小票预演','openReceipt()','small',false,'data-review-order data-action="open-receipt"'),btn('开票预演','openInvoice()','small',false,'data-review-order data-action="open-invoice"'));
 if(['allocation-normal','penny','penny-cap'].includes(state?.scene)&&state?.goods.length)links.push(btn('查看分摊计算','openAllocation()','small',false,'data-action="open-allocation-calculation"'));
 if(state&&tagReadError())links.push(btn('恢复标签数据（演示）','retryOrderTags()','small',false,'id="retry-tags-demo" data-action="retry-tags"'));
 if(!context&&!links.length){prototypeToolsOpen=false;return "";}
 return `<div class="prototype-tools" data-section="prototype-tools"><section id="prototype-tools-panel" class="prototype-tools-panel" aria-label="演示与辅助操作" ${prototypeToolsOpen?'':'hidden'}><div class="prototype-tools-head"><span>演示与辅助操作</span><button class="close" aria-label="收起辅助面板" onclick="setPrototypeToolsOpen(false,true)">×</button></div>${context}${links.length?prototypeToolsSection('当前页面快捷操作',`<div class="prototype-tools-actions">${links.join('')}</div>`):''}</section><button id="prototype-tools-trigger" class="prototype-tools-trigger" data-action="toggle-prototype-tools" aria-label="演示与辅助操作" aria-expanded="${prototypeToolsOpen}" aria-controls="prototype-tools-panel" onclick="setPrototypeToolsOpen(!prototypeToolsOpen)"><span>演示</span><span>工具</span></button></div>`;
}
function renderPrototypeTools(){document.getElementById('scene-count').textContent=SCENES.length;document.getElementById('prototype-tools-root').innerHTML=prototypeToolsHtml();applyNewContentMarkers();updateNewContentToggle();}
function setPrototypeToolsOpen(open,restoreFocus=false){prototypeToolsOpen=!!open;const panel=document.getElementById('prototype-tools-panel'),trigger=document.getElementById('prototype-tools-trigger');if(!panel||!trigger){prototypeToolsOpen=false;return;}panel.hidden=!prototypeToolsOpen;trigger.setAttribute('aria-expanded',String(prototypeToolsOpen));if(restoreFocus)trigger.focus();}
document.addEventListener('click',e=>{if(prototypeToolsOpen&&!(e.composedPath?.().some(n=>n.id==='prototype-tools-root')||e.target.closest('#prototype-tools-root')))setPrototypeToolsOpen(false);});

const initialScene=new URLSearchParams(location.search).get('scene')||location.hash.slice(1)||'combo';resetScene(SCENES.some(s=>s.id===initialScene)?initialScene:'combo');
window.prototypeInspect=()=>({scene:state.scene,mode:state.mode,advanceAmount:state.advanceAmount,exchangeCredit:state.exchangeCredit,page,payment:payment(),gift:state.gift,settings:{...settings},allocations:allocations(),complete:state.complete,cards:state.cards.map(c=>({...c}))});
